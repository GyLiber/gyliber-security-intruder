[workspace]
members = [
  "crates/intruder-cli",
  "crates/intruder-core",
  "crates/intruder-evidence",
  "crates/intruder-net",
  "crates/intruder-policy",
  "crates/intruder-report",
  "crates/intruder-signing",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
authors = ["GyLiber Engineering"]
repository = "https://github.com/GyLiber/gyliber-security-intruder"
publish = false

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "~1.53", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
