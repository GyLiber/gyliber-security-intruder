name: Dependency Lock Bootstrap

on:
  push:
    branches: ["build/http-transport-lock"]
    paths:
      - "Cargo.toml"
      - "crates/intruder-net/Cargo.toml"
      - "crates/intruder-evidence/Cargo.toml"
      - ".github/workflows/dependency-lock.yml"

permissions:
  contents: write

jobs:
  lock:
    name: Generate and validate Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: true

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Validate dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check workspace against generated graph
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the dependency graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh evidence dependency lock"
          git push
