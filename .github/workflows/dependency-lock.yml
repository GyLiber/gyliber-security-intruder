name: Dependency Lock Bootstrap

on:
  push:
    branches: ["build/http-transport-lock"]

permissions:
  contents: read

jobs:
  lock:
    name: Generate and validate Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: true

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Validate dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check workspace against generated graph
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Export generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: http-transport-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
