name: v0.2 Signing Bootstrap

on:
  push:
    branches: ["feat/v0.2-signing-foundation"]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/v0.2-signing-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: v0.2-signing-bootstrap
  cancel-in-progress: true

jobs:
  validate:
    name: Generate lock and validate signing foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: true

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features --locked

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the dependency graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh v0.2 signing dependency lock"
          git push
