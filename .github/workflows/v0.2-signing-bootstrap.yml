name: v0.2 Signing Bootstrap

# Validation trigger after workflow-generated normalization (pass 2).

on:
  push:
    branches: ["feat/v0.2-signing-foundation"]
    paths:
      - "Cargo.toml"
      - "crates/**"
      - ".github/workflows/v0.2-signing-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: v0.2-signing-bootstrap
  cancel-in-progress: true

jobs:
  validate:
    name: Generate lock and validate signing foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          cache: true

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Normalize generated lock and Rust formatting
        id: normalize
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all

          if git diff --quiet -- Cargo.lock 'crates/**/*.rs'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates
          git commit -m "style: normalize v0.2 signing branch"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stop after normalization push
        if: steps.normalize.outputs.changed == 'true'
        run: exit 0

      - name: Check formatting
        if: steps.normalize.outputs.changed != 'true'
        run: cargo fmt --all -- --check

      - name: Check workspace
        if: steps.normalize.outputs.changed != 'true'
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint workspace
        if: steps.normalize.outputs.changed != 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        if: steps.normalize.outputs.changed != 'true'
        run: cargo test --workspace --all-features --locked
